<div class="space-y-4">
	{{ range .Site.Data.faq.items }}
	<details class="group bg-white/5 rounded-lg px-5 py-4">
		<summary class="cursor-pointer font-bold text-white marker:content-none flex items-center justify-between">
			<span>{{ .question }}</span>
			<span class="text-[#00bb55] group-open:rotate-45 duration-300 text-xl">+</span>
		</summary>
		<p class="mt-3 text-sm sm:text-base text-gray-300">{{ .answer }}</p>
	</details>
	{{ end }}
</div>
