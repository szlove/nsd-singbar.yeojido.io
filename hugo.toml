  author = '누벨'
  datePublished = "2026-08-18T08:50:00+09:00"
  dateModified = "2026-08-18T08:50:00+09:00"
  [params.store]
  tel = "010-7456-5410"
  location = "낙성대"
  locationEn = "NSD"
  name = "누벨"
  nameEn = "NOUVEL"
  category = "노래빠"
  categoryEn = "Singbar"
  address = "서울 관악구 봉천동"
  googleMapSrc = "https://www.google.com/maps?q=서울+관악구+봉천동&output=embed"
	[params.store.social.kakaoTalk]
	  id = ""
	  link = ""
	[params.store.social.telegram]
    id = ""
