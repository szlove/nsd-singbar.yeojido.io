[[items]]
  question = "누벨 찾아가려면 어디로 가야 하나요?"
  answer = "낙성대 노래빠 누벨은 서울 관악구 봉천동에 있어요. 낙성대역에서 가까운 편이라 도보로도 오실 수 있어요."
[[items]]
  question = "영업시간이 궁금해요."
  answer = "매일 18:00부터 다음날 15:00까지 노래와 함께 즐기실 수 있어요. 새벽에 들르셔도 문 열려 있어요."
[[items]]
  question = "노래방 예약도 전화로 되나요?"
  answer = "010-7456-5410으로 전화 주시면 룸 상황 확인 후 바로 예약해 드려요. 몇 분이 오시는지만 알려주세요."
[[items]]
  question = "노래빠 이용 요금대가 어떻게 되나요?"
  answer = "1인 100,000원, 2인 160,000원, 3인 240,000원, 4인 320,000원입니다. 정확한 금액은 010-7456-5410으로 확인해 주세요."
